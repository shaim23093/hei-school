        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        name:
          type: string
        firstName:
          type: string
        email:
          type: string
    StudentUpdateRequest:
      type: object
      properties:
        promotionId:
          type: string
          format: uuid
        std:
          pattern: "^STD\\d{5}$"
          type: string
        name:
          maxLength: 100
          minLength: 0
          type: string
        firstName:
          maxLength: 100
          minLength: 0
          type: string
        email:
          maxLength: 150
          minLength: 0
          type: string
    Student:
