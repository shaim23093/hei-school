        std:
          type: string
        name:
          type: string
        firstName:
          type: string
        email:
          type: string
    PromotionUpdateRequest:
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        entryYear:
          maximum: 2100
          minimum: 2000
          type: integer
          format: int32
    Promotion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        entryYear:
          type: integer
          format: int32
    GroupUpdateRequest:
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        path:
          type: string
          enum:
          - EL
          - TN
    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string
          enum:
          - EL
          - TN
    GradeUpdateRequest:
      type: object
      properties:
        value:
          type: number
          format: double
    GradeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid
        value:
          type: number
          format: double
    TeacherCreateRequest:
      required:
      - email
      - firstName
      - name
      - password
      - username
      type: object
      properties:
        username:
          maxLength: 50
          minLength: 3
          type: string
        password:
          maxLength: 100
          minLength: 8
          type: string
        name:
          maxLength: 100
          minLength: 0
          type: string
        firstName:
          maxLength: 100
          minLength: 0
          type: string
        email:
          maxLength: 150
          minLength: 0
          type: string
    StudentCreateRequest:
      required:
      - email
      - firstName
      - name
      - password
      - promotionId
      - std
      - username
      type: object
      properties:
        username:
          maxLength: 50
          minLength: 3
          type: string
        password:
          maxLength: 100
          minLength: 8
          type: string
        promotionId:
          type: string
          format: uuid
        std:
          pattern: "^STD\\d{5}$"
          type: string
        name:
          maxLength: 100
          minLength: 0
          type: string
        firstName:
          maxLength: 100
          minLength: 0
          type: string
        email:
          maxLength: 150
          minLength: 0
          type: string
    PromotionCreateRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        entryYear:
          maximum: 2100
          minimum: 2000
          type: integer
          format: int32
    GroupCreateRequest:
      required:
      - name
      - path
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        path:
          type: string
          enum:
          - EL
          - TN
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        accountId:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - TEACHER
          - STUDENT
    CourseGradeResult:
      type: object
      properties:
        courseId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        credits:
          type: integer
          format: int32
        semester:
          type: integer
          format: int32
        academicYear:
          type: integer
          format: int32
        path:
          type: string
          enum:
          - EL
          - TN
        average:
          type: number
          format: double
        complete:
          type: boolean
        validated:
          type: boolean
    TranscriptResponse:
      type: object
      properties:
        studentId:
          type: string
          format: uuid
        std:
          type: string
        name:
          type: string
        firstName:
          type: string
        promotionName:
          type: string
        semester:
          type: integer
          format: int32
        average:
          type: number
          format: double
        validatedCredits:
          type: integer
          format: int32
        totalCredits:
          type: integer
          format: int32
        status:
          type: string
        results:
          type: array
          items:
